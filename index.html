<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Every page (e.g. /d/kannur) loads this same file, so resolve css/js/assets from the site root. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kerala Journey</title>
  <meta name="description" content="Walk through all fourteen districts of Kerala before you visit: its backwaters, hills, forts, festivals and food." />
  <meta name="theme-color" content="#0d2b21" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230d2b21'/><path d='M16 6c-3 5-3 11 0 20 3-9 3-15 0-20z' fill='%23c9a14a'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=Noto+Serif+Malayalam:wght@500;700&family=Inter:wght@400..800&family=Noto+Sans+Malayalam:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Design pilot: an Apple-inspired look, applied where html[data-skin="apple"] (home, districts, /plan). -->
  <link rel="stylesheet" href="css/apple.css" />
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <dialog id="passport" class="passport" aria-labelledby="passport-title">
    <div class="passport-inner">
      <header>
        <p class="eyebrow">Your travel passport</p>
        <h2 id="passport-title">Stamps collected</h2>
        <button class="icon-btn" data-close aria-label="Close passport">✕</button>
      </header>
      <div class="passport-stats" id="passport-stats"></div>
      <div class="stamps" id="stamps"></div>
      <details class="passport-food">
        <summary>Food passport: tick off what you've tasted</summary>
        <ol id="passport-food"></ol>
      </details>
      <p class="passport-links"><a href="/journeys" data-close>Your journeys</a> · <a href="/plan" data-close>Your plan</a></p>
      <footer>
        <p class="muted" id="passport-note"></p>
        <button class="link-btn" id="passport-reset">Reset stamps</button>
      </footer>
    </div>
  </dialog>

  <!-- Content -->
  <script src="js/data/config.js"></script>
  <script src="js/data/districts.js"></script>
  <script src="js/data/food.js"></script>
  <script src="js/data/table.js"></script>
  <script src="js/data/visit.js"></script>
  <script src="js/data/sounds.js"></script>
  <script src="js/data/panoramas.js"></script>
  <script src="js/data/culture.js"></script>
  <script src="js/data/essentials.js"></script>
  <script src="js/data/map.js"></script>
  <script src="js/data/media.js"></script>
  <script src="js/data/media-overrides.js"></script>
  <script src="js/data/plan.js"></script>
  <script src="js/data/doings.js"></script>
  <!-- App -->
  <script src="js/i18n.js"></script>
  <script src="js/meta.js"></script>
  <script src="js/experiences.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/journeys.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
